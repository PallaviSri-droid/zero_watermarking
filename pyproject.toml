[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-watermarking"
version = "0.2.2"
description = "Collision-aware Pareto benchmark and reproducible pipeline for medical-image zero-watermarking"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scipy>=1.11,<2",
  "scikit-image>=0.22,<1",
  "opencv-python>=4.9,<5.1",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "scikit-learn>=1.4,<2",
  "Pillow>=10.2,<13",
  "PyYAML>=6.0,<7",
  "tqdm>=4.66,<5",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "pytest>=8.0,<9",
  "kaggle>=1.7,<3",
  "huggingface_hub>=0.25,<2",
  "jupyter>=1.0,<2",
  "ipykernel>=6.29,<8",
]

[project.optional-dependencies]
research = [
  "dtcwt>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
